<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W-ARD Radio Station</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0b0c10;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .player-card {
      background: #1f2833;
      border: 2px solid #45a29e;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .logo-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      height: 40px;
      margin-bottom: 20px;
    }

    .bar {
      width: 8px;
      background: #66fcf1;
      height: 6px;
      border-radius: 4px;
      transition: height 0.15s ease;
    }

    .visualizer.active .bar {
      animation: bounce 0.8s infinite ease-in-out alternate;
    }

    .visualizer.active .bar:nth-child(1) { animation-delay: 0.1s; }
    .visualizer.active .bar:nth-child(2) { animation-delay: 0.3s; }
    .visualizer.active .bar:nth-child(3) { animation-delay: 0.2s; }
    .visualizer.active .bar:nth-child(4) { animation-delay: 0.5s; }
    .visualizer.active .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 6px; }
      100% { height: 38px; }
    }

    .play-btn {
      background: linear-gradient(135deg, #45a29e, #66fcf1);
      border: none;
      color: #0b0c10;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(102, 252, 241, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px auto;
      font-weight: bold;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 25px rgba(102, 252, 241, 0.6);
    }

    .status-text {
      font-size: 15px;
      color: #66fcf1;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      background: #0b0c10;
      padding: 10px 18px;
      border-radius: 30px;
    }

    .volume-container span {
      font-size: 16px;
      color: #c5c6c7;
    }

    input[type=range] {
      accent-color: #66fcf1;
      cursor: pointer;
      width: 140px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- W-ARD Logo -->
    <div class="logo-container">
      <img src="watermarked_img_17370810652637262339.jpg" alt="W-ARD Family Station Logo" class="logo-img">
    </div>

    <!-- Audio Visualizer -->
    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- Controls -->
    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    
    <div class="status-text" id="status">Click Play to Tune In Live</div>

    <div class="volume-container">
      <span>🔈</span>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" oninput="adjustVolume(this.value)">
      <span>🔊</span>
    </div>

    <!-- Hidden Live Stream Engine -->
    <audio id="radioStream" preload="none">
      <source src="https://eu4.fastcast4u.com/proxy/terrawingztwitch?mp=/stream" type="audio/mpeg">
    </audio>
  </div>

  <script>
    const audio = document.getElementById('radioStream');
    const playBtn = document.getElementById('playBtn');
    const status = document.getElementById('status');
    const visualizer = document.getElementById('visualizer');
    const streamUrl = "https://eu4.fastcast4u.com/proxy/terrawingztwitch?mp=/stream";

    function togglePlay() {
      if (audio.paused) {
        // Reload stream source to flush buffer and snap directly to real-time live edge
        audio.src = streamUrl + '&t=' + new Date().getTime();
        audio.load();
        
        audio.play().then(() => {
          playBtn.innerHTML = '❚❚';
          status.innerHTML = '🔴 Broadcasting Live';
          visualizer.classList.add('active');

          // Jump to latest buffered edge
          if (audio.buffered.length > 0) {
            audio.currentTime = audio.buffered.end(audio.buffered.length - 1);
          }
        }).catch(error => {
          status.innerHTML = 'Stream Offline or Loading...';
        });
      } else {
        audio.pause();
        audio.src = ''; // Stop downloading stream in background
        playBtn.innerHTML = '▶';
        status.innerHTML = 'Paused (Click to Catch Up Live)';
        visualizer.classList.remove('active');
      }
    }

    function adjustVolume(val) {
      audio.volume = val;
    }

    // Auto catch up to live stream if tab regains focus or un-minimizes
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !audio.paused && audio.buffered.length > 0) {
        const liveEdge = audio.buffered.end(audio.buffered.length - 1);
        if (liveEdge - audio.currentTime > 3) {
          audio.currentTime = liveEdge;
        }
      }
    });
  </script>

</body>
</html>
